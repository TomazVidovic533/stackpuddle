services:
  postgres:
    image: postgres:18.6-bookworm@sha256:1c59e2c3c818eaa0f0628f695b36e7c9e362d6b219b36a54a32df645cbd7e1af
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_admin_password
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256 --auth-local=peer
    command:
      - postgres
      - -c
      - max_connections=${STACKPUDDLE_POSTGRES_MAX_CONNECTIONS:-100}
      - -c
      - shared_buffers=${STACKPUDDLE_POSTGRES_SHARED_BUFFERS_MIB:-128}MB
      - -c
      - password_encryption=scram-sha-256
    secrets:
      - source: postgres_admin
        target: postgres_admin_password
    volumes:
      - postgres_data:/var/lib/postgresql
    mem_limit: ${STACKPUDDLE_POSTGRES_MEMORY_MIB:-1024}m
    cpus: ${STACKPUDDLE_POSTGRES_CPUS:-1}
    shm_size: 128m
    healthcheck:
      test: [CMD, pg_isready, -h, 127.0.0.1, -p, "5432", -U, postgres, -d, postgres]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    stop_grace_period: 30s
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

secrets:
  postgres_admin:
    file: ${STACKPUDDLE_POSTGRES_ADMIN_PASSWORD_FILE:?Set STACKPUDDLE_POSTGRES_ADMIN_PASSWORD_FILE}

volumes:
  postgres_data: {}
