# The shared consumer fixture: a one-shot psql consumer of the postgres module. Its migration job runs
# as the migration identity and its app runs as the runtime identity; both read their credential and
# the CA from delivered files and connect with sslmode=verify-full.
#
# The project name is a placeholder: a test replaces `name: consumer` with its own disposable project
# name so every object the engine derives from it carries that name. Changing this fixture is a
# breaking change for every test that reads it.
apiVersion: stackpuddle/v1
kind: Project
metadata:
  name: consumer
spec:
  modules:
    db:
      definition: postgres
      options:
        users:
          app_runtime:
            purpose: runtime
            passwordSecretRef: app-runtime-password
            memberOf: [app_readwrite]
          app_migrator:
            purpose: migrations
            passwordSecretRef: app-migrator-password
        roles:
          app_readwrite:
            login: false
        databases:
          app:
            owner: app_migrator
            connectRoles: [app_readwrite]
            schemas:
              public:
                grants:
                  app_readwrite:
                    tables: [SELECT, INSERT, UPDATE, DELETE]
                    sequences: [USAGE, SELECT]
  workloads:
    migrate:
      type: job
      image: postgres:18.6-bookworm@sha256:1c59e2c3c818eaa0f0628f695b36e7c9e362d6b219b36a54a32df645cbd7e1af
      environment:
        MIGRATION_FAIL: "0"
        PGSSLMODE: verify-full
        PGSSLROOTCERT: /run/sp/ca.crt
      command:
        - sh
        - -c
        - |
          set -eu
          if [ "$MIGRATION_FAIL" = "1" ]; then
            echo "migration refused by MIGRATION_FAIL" >&2
            exit 3
          fi
          PGPASSWORD="$(cat /run/sp/password)"
          export PGPASSWORD
          psql -X -v ON_ERROR_STOP=1 -At <<'SQL'
          CREATE TABLE IF NOT EXISTS schema_history (id serial PRIMARY KEY, applied_by text NOT NULL, applied_at timestamptz NOT NULL DEFAULT now());
          CREATE TABLE IF NOT EXISTS items (id serial PRIMARY KEY, note text);
          INSERT INTO schema_history (applied_by) VALUES (current_user);
          SQL
      dependencies:
        database:
          capability: postgresql.connection/1
    app:
      type: service
      image: postgres:18.6-bookworm@sha256:1c59e2c3c818eaa0f0628f695b36e7c9e362d6b219b36a54a32df645cbd7e1af
      environment:
        PGSSLMODE: verify-full
        PGSSLROOTCERT: /run/sp/ca.crt
      command:
        - sh
        - -c
        - |
          set -eu
          PGPASSWORD="$(cat /run/sp/password)"
          export PGPASSWORD
          psql -X -v ON_ERROR_STOP=1 -At -c 'SELECT count(*) FROM items'
          exec sleep 3600
      dependencies:
        database:
          capability: postgresql.connection/1
      prerequisites:
        - job: migrate
  bindings:
    - consumer: workload/migrate
      dependency: database
      source:
        object: module/db
        export: sql
      parameters:
        user: app_migrator
        database: app
      delivery:
        environment:
          PGHOST: host
          PGPORT: port
          PGDATABASE: database
          PGUSER: username
        files:
          password:
            path: /run/sp/password
            mode: "0400"
            owner: "999:999"
          ca:
            path: /run/sp/ca.crt
            mode: "0444"
    - consumer: workload/app
      dependency: database
      source:
        object: module/db
        export: sql
      parameters:
        user: app_runtime
        database: app
      delivery:
        environment:
          PGHOST: host
          PGPORT: port
          PGDATABASE: database
          PGUSER: username
        files:
          password:
            path: /run/sp/password
            mode: "0400"
            owner: "999:999"
          ca:
            path: /run/sp/ca.crt
            mode: "0444"
  environments:
    local:
      runtime:
        type: compose
        context: default
      secrets:
        provider: local
    failing-migration:
      runtime:
        type: compose
        context: default
      secrets:
        provider: local
      overrides:
        workloads:
          migrate:
            environment:
              MIGRATION_FAIL: "1"
