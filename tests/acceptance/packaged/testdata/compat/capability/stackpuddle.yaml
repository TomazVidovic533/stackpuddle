apiVersion: stackpuddle/v1
kind: Project
metadata:
  name: {{NAME}}
spec:
  definitions:
    need:
      path: definitions/need
  modules:
    only:
      definition: need
      options: {note: only}
  workloads:
    app:
      type: service
      image: mirror.gcr.io/library/busybox@sha256:a7dbc319b1438115a207e11930dc4bb3e643dcb3ec0bdd694bb36cd8fad289ec
      command: [sleep, "3600"]
  applications:
    main:
      workloads: [app]
      default: true
  environments:
    local:
      runtime:
        type: compose
        context: default
      secrets:
        provider: local
