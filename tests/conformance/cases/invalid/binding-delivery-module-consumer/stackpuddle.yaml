apiVersion: stackpuddle/v1
kind: Project
metadata:
  name: shop
spec:
  definitions:
    audit-store:
      path: definitions/audit-store
  workloads:
    api:
      type: service
      image: ghcr.io/example/api:1.4.2
      listeners:
        http:
          port: 8080
          protocol: http
      exports:
        http:
          capability: http.api/1
          listener: http
  modules:
    audit:
      definition: audit-store
  bindings:
    - consumer: module/audit
      dependency: api
      source:
        object: workload/api
        export: http
      delivery:
        environment:
          API_HOST: host
