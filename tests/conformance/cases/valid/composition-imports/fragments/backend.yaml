apiVersion: stackpuddle/v1
kind: Fragment
spec:
  inputs:
    api-log-level:
      sensitivity: public
      value: info
  workloads:
    api:
      type: service
      image: ghcr.io/example/api:1.4.2
      environment:
        LOG_LEVEL:
          input: api-log-level
      listeners:
        http:
          port: 8080
          protocol: http
      exports:
        http:
          capability: http.api/1
          listener: http
